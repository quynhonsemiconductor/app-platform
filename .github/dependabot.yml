# =============================================================================
# Dependabot — VERSION updates.
#
# This repo had no dependabot.yml at all, and `renovate.json` here is inert: the
# Renovate app is not installed on the organisation (checked against the org's
# installation list, and no repo has ever seen a Renovate pull request or the
# Dependency Dashboard issue its own preset requests). So until today the only
# updates landing here were Dependabot SECURITY updates, which fire from the
# advisory database and need no config file — #86 (fastify) is one.
#
# That is a poor place for the repo whose packages every product consumes to be:
# its own dependencies moved only once something became publicly vulnerable.
#
# NOT SHAREABLE. GitHub provides no inheritance for this file — no org defaults,
# no `extends` — so every repository needs its own copy. That is the whole reason
# the near-identical 69-line versions in rova and opshub exist.
# =============================================================================
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "npm"
    # One pnpm workspace, one lockfile at the root — that covers every package.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      # MINOR AND PATCH ONLY, and the exclusion is the point of the grouping.
      #
      # Without `update-types`, a group sweeps majors in with everything else and
      # presents a framework upgrade as a routine bump. Four such PRs were opened
      # across rova and opshub in one week — NestJS 11 -> 12 across nine packages
      # plus ioredis 5 -> 6 in one, TypeScript 6 -> 7 and vitest 4 -> 5 in another
      # — and all four were closed unreviewed, taking their bundled minors and
      # patches with them.
      #
      # It matters more here than anywhere: these packages declare peer ranges like
      # `@nestjs/common: >=11`, which would silently ACCEPT a major nobody has
      # tested against.
      #
      # Majors still get PRs. They open individually, one dependency each.
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
