packages:
  - "packages/*"

# Transitive CVE floors. Everything here is a package this repo does NOT declare: it
# arrives under a dev or build tool whose own declared range already admits the fix, so
# the lockfile was simply resolved before the advisory published.
#
# WHY THIS BLOCK EXISTS AT ALL. Until now there was no `overrides:`, and
# `security / Dependency CVE scan (osv-scanner)` ran REPORT-ONLY — the shared workflow
# defaults `osv_blocking` to false and nothing set it — so sixteen findings printed as
# warnings inside a job that concluded `success`. `osv_blocking` is set to true in the
# same change that clears them.
overrides:
  # GHSA-698v-4r3x-3vcv: vite 7.3.6 (via vitest) pulls launch-editor <2.14.2; 7.3.7 is the fixed 7.x.
  vite@>=7.0.0 <7.3.7: 7.3.7
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870, quadratic CPU in !!omap resolution, fixed
  # 4.3.1) and GHSA-2883-xcg3-v3hh (fixed 4.3.2), CVSS 7.5 each. The second walks past
  # the first's mitigation: `maxTotalMergeKeys` counts only the keys a merge actually
  # CONTRIBUTES, so an alias chain of EMPTY merge sources costs CPU without ever
  # incrementing the counter the limit reads.
  #
  # `^` and not `>=`: the looser form resolves into 5.x, a major nothing here declares.
  "js-yaml@4": "^4.3.2"
  # GHSA-r3ph-w7gj-g6xm (CVSS 5.3, maxTotalMergeKeys does not bound CPU for empty merge
  # sources), fixed in 5.4.1. @nestjs/swagger 11.4.7 declares js-yaml exactly 5.3.0, so the
  # 4.x floor above does not reach it. Capped to the 5.x line, the major swagger already uses.
  "js-yaml@>=5.0.0 <5.4.1": "^5.4.1"
  # GHSA-5jgf-p345-68v8, GHSA-7p8r-x3mc-p8w7, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf
  # and GHSA-jqff-g426-hqxp — CVSS 7.5 each, five advisories against one URI parser:
  # host confusion and SSRF via failed IDN canonicalisation, a backslash authority
  # introducer, malformed and repeated authority forms, and percent-encoded schemes.
  # Fixed in 3.1.6 on the 3.x line.
  #
  # THIS OVERRIDE MOVES 3.x CONSUMERS TO 4.x ON PURPOSE (#136). Two later advisories —
  # GHSA-hrr3-gc8f-f4qj (host case normalisation via percent-encoded octets; patched in
  # 2.4.7, 3.1.8 and 4.1.5) and GHSA-jvvf-x445-j334 (mailto header injection; 4.x only,
  # patched in 4.1.5) — are cleared everywhere by one floor, `4.1.5`, so the whole tree is
  # held to a single patched major instead of tracking a fix per major. The upper bound
  # still matters: `>=4.1.5` alone would let it drift into 5.x, a major nothing here
  # declares. rova's own fast-uri entry records where an unbounded override leads — a tree
  # carried into an unpatched major, tripping its own scanner.
  #
  # Cost, stated rather than glossed: the 3.x line has its own fix (3.1.8), so this is a
  # choice for one major over a per-major floor like the brace-expansion entries below. It
  # is safe only while every consumer (ajv, reached through fastify and commitlint, both dev-time here) accepts 4.x; the
  # test and build suites are the check.
  "fast-uri@<3.1.6": ">=4.1.5 <5.0.0"
  # GHSA-rgw5-rvv9-x895 (CVSS 7.5, DoS via unbounded intermediate arrays) and
  # GHSA-mh99-v99m-4gvg. The first explicitly BYPASSES the second's mitigation, so the
  # second's fixes are not safe floors — only newer ones.
  #
  # THREE entries, one per major present in this tree (1.1.16, 2.1.2, 5.0.8), because
  # the advisory is patched per major: 1.1.18, 2.1.4, 5.0.9. This DIVERGES from rova,
  # which forces its whole tree to 5.0.9 — it could do that because it had already
  # verified its consumers accept a forced 5.x. Nothing here has verified that, and a
  # per-major floor is exactly as effective without the cross-major push, which is the
  # thing the fast-uri entry above exists to warn about.
  #
  # RAISED AGAIN for three further advisories against the same package, each patched per
  # major: GHSA-6j4f-fj2g-mc7p (7.5) and GHSA-qhr7-859c-m2p7 (7.5) and GHSA-q2hr-2g5m-vwhr
  # (5.3). The newest fix across the three is 1.1.21, 2.1.7 and 5.0.12 respectively, so those
  # are the floors. Still one entry per major, still no cross-major push.
  "brace-expansion@<1.1.21": ">=1.1.21 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.7": ">=2.1.7 <3.0.0"
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12"
  # GHSA-67mh-4wv8-2f99 (CVSS 5.3, dev-server CORS) -- reached only through drizzle-kit's @esbuild-kit
  # loader, which identity uses at dev time to regenerate its reference schema. Capped below 0.26.
  "esbuild@<0.25.0": ">=0.25.0 <0.29.0"
  # GHSA-68fv-2mgg-jv7q (CVSS 8.7) — fixed in 1.2.2. Reached through magicast (vitest coverage),
  # which resolves it at 1.2.1 while postcss already resolves 1.2.2: the lockfile simply had
  # not been moved. Build/test toolchain only; capped below 2.0.0 like the entries above.
  "source-map-js@<1.2.2": ">=1.2.2 <2.0.0"
  # GHSA-fxqj-rqcc-2cmp (CVSS 6.3) — incomplete fix of GHSA-6g55-p6wh-862q: an
  # attacker-controlled `sourceMappingURL` is still read. Fixed in 8.5.23. Build
  # toolchain only.
  "postcss@<8.5.23": ">=8.5.23"
  # GHSA-2v37-7h3g-55p8 (CVSS 8.2) — a custom generator can loop indefinitely when size
  # is zero. Reached only through postcss, which calls it with a fixed non-zero size, so
  # the zero-size path is not reachable here; floored anyway so the scanner stays clean.
  # NOT forced across majors: postcss declares ^3.3.11 and nanoid 4.x+ is ESM-only.
  "nanoid@>=3.0.0 <3.3.18": "3.3.20"
  # GHSA-m9gg-hp2v-232j (CVSS 7.4) and GHSA-f596-whhp-79r4 (CVSS 3.7) — both fixed in
  # 1.14.5 on the 1.x line. Reached only through the OTLP gRPC exporters that
  # `@opentelemetry/sdk-node` pulls in; nothing here opens a gRPC server. Capped below 2.0.0.
  "@grpc/grpc-js@<1.14.5": ">=1.14.5 <2.0.0"
  # Seven advisories against fastify 5.11.3 (GHSA-3m5p-2c4r-xxw2, -4mh8-r7rc-xpvc, -667r-xxjv-c9mm,
  # -9q9j-q6p8-xq58, -hwr6-493r-vm6h, -p68q-wchp-6fh7, -w2qp-rph6-63g4; CVSS up to 8.1), fixed in
  # 5.12.5. `@nestjs/platform-fastify` pins fastify EXACTLY (11.2.7 -> 5.11.3), so a range floor
  # on fastify itself cannot reach it. It is a devDependency of platform-runtime used to run a real
  # Nest + Fastify server in tests, never published; this repo's own fastify devDependencies
  # already resolve to 5.12.5, so this only brings the adapter's copy in line with them.
  "@nestjs/platform-fastify>fastify": "5.12.7"
  # GHSA-mrhx-c7xc-m3w5 (CVSS 8.2, memory exhaustion validating oversized constrained
  # collections, fixed 4.6.6): exactly one zod version in the lockfile. Identity and the
  # reference consumer pin 4.6.6 directly; this floor covers the `^4.4.3` dev ranges.
  "zod@>=4 <4.6.6": "4.6.6"
  # @azure/identity 4.14.0 declares msal-node ^6.0.0, but the fix for GHSA-xcx6-jx8p-x3h5
  # (CVSS 7.5) is 7.1.0 — a major ACROSS the vendor's own dependency. No code here imports
  # msal directly (it is internal to @azure/identity); platform-mail's suite gates the pair.
  # Revisit when @azure/identity ships a minor declaring 7.x.
  "@azure/identity>@azure/msal-node": "7.1.0"
  # Four fast-uri advisories (GHSA-333x-w4r6-6crp, -w74x-v6f9-j3xg, -wjr9-j795-jxcr,
  # -xhq7-xmqj-769h) — fixed 3.1.9 (3.x) and 4.2.3 (4.x). The fastify chain
  # (@fastify/ajv-compiler, ajv, fast-json-stringify) declares ^4.0.0 / ^3 ranges that already
  # allow the fixes; the floor just moves stale resolutions.
  "fast-uri@>=4 <4.2.3": "4.2.3"
  "fast-uri@>=3 <3.1.9": "3.1.9"
  # GHSA-85x2-q946-cp5h + GHSA-8c8m-p3m8-cjg8 + GHSA-m943-m63m-w62w (CVSS 6.5 each, fixed
  # 10.1.4): mailparser resolves a stale nodemailer; platform-mail's own pin is 10.1.7.
  "nodemailer@<10.1.4": "10.1.7"
  # GHSA-4qv8-2p9j-2685 + GHSA-f72v-6w45-q472 (CVSS 5.9 each, fixed 8.12.2): testcontainers
  # (dev-only) resolves undici 8.11.2.
  "undici@>=8 <8.12.2": "8.12.2"

# pnpm 11 fails an install that ignores a dependency's build script unless the decision is
# written down. These five were already being skipped (pnpm 10 only warned); recording them as
# `false` keeps today's behaviour exactly. None is needed: esbuild and protobufjs ship their
# binaries / generated code without the script, cpu-features and ssh2 fall back to pure JS
# (via testcontainers), and @scarf/scarf is install-time analytics.
allowBuilds:
  "@scarf/scarf": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
