# =============================================================================
# Release Commenter — thin caller of the shared reusable (qnsc-ci). When a
# GitHub Release is published, back-comments on every PR merged since the last
# release and adds a "released: vX.Y.Z" label (semantic-release bot UX).
# =============================================================================
name: Release Commenter

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  comment:
    uses: quynhonsemiconductor/ci/.github/workflows/release-commenter.yml@956804ad4aa2dcf930909553d306d72b3708fd5d # v1.34.1+ci#308
    permissions:
      contents: read
      pull-requests: write
      issues: write
