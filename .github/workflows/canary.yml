# Canary packages: every pull request publishes the packages it changes to GitHub Packages as
#
#     <version>-pr.<number>.<sha7>        under the dist-tag   pr-<number>
#
# so a product can try the branch before it merges:
#
#     pnpm add @quynhonsemiconductor/platform-http@pr-123
#
# A prerelease never satisfies a plain range such as `^4.1.0`, and the `latest` tag is not touched,
# so nothing installs a canary unless it asks for one by tag or exact version.
#
# TWO JOBS, ON PURPOSE. `pack` runs the pull request's code (install, build) and holds no
# credentials beyond a read-only token. `publish` holds `packages: write` and runs NOTHING from
# the pull request: no checkout, no install, no build -- it only uploads tarballs that `pack`
# produced. Collapsing them would hand a write token to whatever a dependency bump in a
# Renovate PR happens to execute at install time.
#
# Same-repo pull requests only. A fork's token cannot publish, and should not try.
name: Canary

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  pack:
    name: Pack changed packages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      count: ${{ steps.pack.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: "changed" is a diff against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack
        id: pack
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          label="pr.${PR_NUMBER}.${HEAD_SHA:0:7}"
          node tools/consumer-ci/pack.mjs --out canary --canary "$label" --changed-since "origin/${BASE_REF}" --pr-title "$PR_TITLE"
          echo "count=$(node -p "require('./canary/manifest.json').length")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.pack.outputs.count != '0'
        with:
          name: canary-tarballs
          path: canary
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish canaries
    needs: pack
    if: needs.pack.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      # No cache here, and no checkout: this job holds a write token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@quynhonsemiconductor'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canary-tarballs
          path: canary

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tag="pr-${PR_NUMBER}"
          {
            echo "### Canary packages"
            echo
            echo "Dist-tag \`${tag}\`. Install one with \`pnpm add <name>@${tag}\`."
            echo
            echo "| Package | Version |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          node -e '
            for (const m of require("./canary/manifest.json")) console.log([m.file, m.name, m.version].join(" "));
          ' | while read -r file name version; do
            # A re-run of the same commit finds its version already published; that is not an error.
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published"
            else
              # `./` matters: without it npm reads `canary/<file>.tgz` as a GitHub `user/repo`
              # shorthand and tries to clone it over ssh.
              npm publish "./canary/${file}" --tag "$tag" --registry https://npm.pkg.github.com
            fi
            echo "| \`${name}\` | \`${version}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
