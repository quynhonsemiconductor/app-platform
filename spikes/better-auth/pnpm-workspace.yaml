packages: []

# Same CVE floors as the repo root (see ../../pnpm-workspace.yaml), for the same reason: the root
# `security / Dependency CVE scan (osv-scanner)` walks the repo recursively and is BLOCKING, so this
# lockfile is scanned too. Transitive only; nothing here declares these packages.
overrides:
  "js-yaml@4": "^4.3.2"
  # `@nestjs/platform-fastify` pins fastify EXACTLY, so a range floor on fastify cannot reach it.
  "@nestjs/platform-fastify>fastify": "5.12.7"
  # GHSA-67mh-4wv8-2f99, reached only through drizzle-kit's @esbuild-kit loader (dev tool).
  "esbuild@<0.25.0": ">=0.25.0 <0.29.0"

# pnpm 11 fails an install that ignores a build script unless the decision is recorded.
# `argon2` (node-argon2) is a DEV dependency used only to mint solodesk-style hashes in a test;
# it needs its native binding. The rest are skipped, as in the root workspace.
allowBuilds:
  argon2: true
  "@scarf/scarf": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
