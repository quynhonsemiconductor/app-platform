# Lint · typecheck · test · secret-scan on every PR and push to main.
# Job names are the status-check contexts required by the branch ruleset,
# matching the quynhonsemiconductor/rova convention.
name: CI

on:
  merge_group:
  push:
    branches: [main]
  # Manual run. Like a push, it is not a pull request, so the consumer jobs skip and the gate
  # must stay green -- this is how that branch of the gate is exercised without touching main.
  workflow_dispatch:
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED, and that takes a group of its own per commit — the old
  # `ci-<ref>` group shared one slot across main pushes, so a second push cancelled the first's
  # run (rova's incident, copied here before it happens). pull_request keeps one group per PR,
  # cancelled in progress.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Which parts changed ─────────────────────────────────────────────────────
  # Docs-only changes cannot affect the packages, so the heavy jobs skip and the gate reports a
  # clean "nothing to test" instead of counting skipped-as-passing. Every doubt runs everything —
  # see actions/changed-paths in the ci repo (handles pull_request and merge_group; pushes to
  # main always run everything, because deploys and release-please wait for that run).
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: paths
        uses: quynhonsemiconductor/ci/actions/changed-paths@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          # DELIBERATELY EMPTY today: `lint` runs `pnpm format:check` over every file including
          # markdown and docs/, so an ignore list that covered those would let formatting drift
          # straight past the gate. The changed-paths contract stays wired so a future list is
          # one edit — narrow it only when the checked paths and the ignore list agree.
          ignore: |
    outputs:
      run: ${{ steps.paths.outputs.run }}
  lint:
    name: Lint & typecheck
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Formatting is part of this job, so it is part of `CI required`: it drifted to ~30 files
      # on main while nothing checked it.
      - run: pnpm format:check
      - run: pnpm lint
      # Build before typecheck: packages resolve each other via their built
      # dist types (e.g. @quynhonsemiconductor/identity depends on @quynhonsemiconductor/platform-cache).
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Tests
    needs: [changes, lint]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # packages/testing starts PostgreSQL 18 and Valkey through the runner's Docker daemon.
      # Fail here, loudly, if the runner image ever stops providing it; the harness itself
      # also throws when CI is set rather than skipping.
      - run: docker version
      # Build first so workspace packages resolve their cross-package imports.
      - run: pnpm build
      - run: pnpm test

  # ── Consumer CI ─────────────────────────────────────────────────────────────
  # Does this pull request break a product? Each product is checked out, pointed at tarballs
  # packed from THIS pull request, and asked to typecheck and run its unit tests. The answer is a
  # native check on the PR; nothing is dispatched to another repository.
  #
  # Tarballs and not the registry: a package that has never been published, or a version that
  # exists only on this branch, installs the same way, and the real version numbers keep every
  # peer range (`>=2.0.0`) satisfiable -- a `-pr.N` prerelease would not satisfy one.
  tarballs:
    name: Pack packages for consumer CI
    needs: changes
    # Same-repo pull requests only: a fork has no access to the App credentials below.
    # (And not on a docs-only change: `changes` gates the heavy jobs.)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History: the pack step reads the PR's commits to learn whether a package is breaking.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --bump-since: a PR's package.json still carries the RELEASED version. A breaking PR is packed
      # as the major release-please will cut (identity 8.0.0, not 7.1.0), so products still on the
      # old major are reported "not applicable" instead of being tested against a change they have
      # not adopted.
      - name: Pack
        env:
          BASE_REF: ${{ github.base_ref }}
          # A squash merge commits the PR title, so a breaking marker may live only there.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/consumer-ci/pack.mjs --out tarballs --bump-since "origin/${BASE_REF}" --pr-title "$PR_TITLE"

      # The consumer jobs install the PRODUCT's dependencies, not this repo's, so they have no
      # `semver`. Ship the link tool with the tarballs, together with the exact `semver` this
      # repo's lockfile resolved (`-L` follows pnpm's symlink; semver has no dependencies).
      - name: Bundle the link tool
        run: |
          mkdir -p tarballs/tools/node_modules
          cp tools/consumer-ci/link.mjs tools/consumer-ci/packages.mjs tarballs/tools/
          cp -rL node_modules/semver tarballs/tools/node_modules/semver

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-tarballs
          path: tarballs
          retention-days: 1
          if-no-files-found: error

  consumer:
    name: Consumer · ${{ matrix.product }}
    needs: [changes, tarballs]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `packages: read` only so `${NODE_AUTH_TOKEN}` in the product's .npmrc resolves; every
    # @quynhonsemiconductor/* dependency comes from the tarballs.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pnpm` is the version each product's own CI pins. Keep it in step with them.
          # For a product whose package.json has `packageManager`, it must be EQUAL: pnpm/action-setup
          # fails ("Multiple versions of pnpm specified") when the two differ. rova: 11.28.5 (rova#663).
          - { product: rova, pnpm: '11.28.5', unit_tests: true }
          - { product: opshub, pnpm: '10.33.2', unit_tests: true }
    steps:
      # Read-only App (contents: read), never the write-capable automation App in a pull-request
      # workflow. The token is used by the checkout below and is not exported to any later step;
      # the action revokes it when the job ends.
      #
      # Scoped to THIS job's product, not to all three: the job needs one repository, and a
      # request naming a repository the App is not installed on fails outright, so the broad form
      # would turn one missing installation into three red jobs with the same message.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ vars.QNSC_REPO_READER_APP_ID }}
          private-key: ${{ secrets.QNSC_REPO_READER_PRIVATE_KEY }}
          repositories: ${{ matrix.product }}
          permission-contents: read

      # The product goes into a subdirectory so the workspace root has no package.json: the pnpm
      # setup action would otherwise read a `packageManager` from the root and refuse the product's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quynhonsemiconductor/${{ matrix.product }}
          token: ${{ steps.token.outputs.token }}
          path: product
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: consumer-tarballs
          path: tarballs

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          node-version: '24'
          pnpm-version: ${{ matrix.pnpm }}
          install-deps: 'false'
          working-directory: product

      # A tarball is linked only when its version satisfies the range the product declares for it
      # (identity 8.0.0 is "not applicable" to a product on ^7.1.0). If nothing applies the job
      # passes and the steps below are skipped. It FAILS if the product depends on none of our
      # packages at all, so this check cannot go green while testing the registry versions.
      - name: Point the product at this pull request's packages
        id: link
        run: node tarballs/tools/link.mjs --product product --tarballs "$GITHUB_WORKSPACE/tarballs"

      # `--no-frozen-lockfile`: the specifiers just changed, so the committed lockfile is
      # intentionally out of date. The rewritten lockfile stays in this throwaway checkout.
      - name: Install
        if: steps.link.outputs.applicable == 'true'
        working-directory: product
        run: pnpm install --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        if: steps.link.outputs.applicable == 'true'
        working-directory: product
        run: pnpm typecheck
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `test/qnsc-dependency-ranges.spec.ts` (rova#704, opshub#391) asserts that every @quynhonsemiconductor/* range in the
      # COMMITTED package.json is a caret. This job has just rewritten those ranges to `file:` tarballs on purpose, so
      # that one spec can only fail here, on every pull request that changes a package. It is a check of the product's
      # repository, not of the packages, and runs in the product's own CI.
      - name: Unit tests
        if: steps.link.outputs.applicable == 'true' && matrix.unit_tests
        working-directory: product
        run: pnpm test --exclude test/qnsc-dependency-ranges.spec.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `CI required` is THE required check for this workflow. It exists because GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — the failure mode behind opshub #110 (a title edit
  # cancelled the real run; the replacement skipped every heavy job and went green) and
  # rova #558-#590 (a base-branch filter skipped both CI workflows for stacked PRs, leaving
  # five PRs on 5/5 green with no tests, build, E2E or security scan).
  #
  # `if: always()` is mandatory — without it the gate skips as soon as a dependency fails
  # and inherits the very bug it closes. A cancelled WORKFLOW cancels the gate rather than
  # failing it, so a run superseded by `cancel-in-progress` leaves no red check behind.
  #
  # `needs` MUST list every job that is expected to run. A job outside `needs` is a job
  # outside the gate.
  #
  # The consumer jobs are in the gate, with ONE exception to "skipped fails". `tarballs` and
  # `consumer` need the read-only App's credentials, which a fork's pull request does not get, and
  # they are not meant to run on a push to main. So:
  #
  #   * lint and test -- always strict: only `success` passes;
  #   * tarballs and consumer -- strict on a same-repo pull request (a skip there means the `if:`
  #     or the App credentials broke, which is exactly the silent hole this gate exists to
  #     close), and `skipped` is accepted only on a push or a fork pull request. A FAILURE is
  #     never accepted anywhere.
  #
  # Two calls of the shared action rather than one with `allow-skipped`, because that input is
  # all-or-nothing and would loosen lint and test too.
  ci-required:
    name: CI required
    if: always()
    needs: [changes, lint, test, tarballs, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Nothing to run (ignore list matched): only `changes` itself must have succeeded.
      - name: Nothing here to test (every changed file is ignorable)
        if: ${{ needs.changes.outputs.run != 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          results: ${{ needs.changes.result }}

      - name: lint and test must succeed
        if: ${{ needs.changes.outputs.run == 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          results: ${{ needs.lint.result }},${{ needs.test.result }}

      # `always()`: report this too when a step above failed, so one red run shows both.
      - name: consumer jobs must succeed (skipped only off same-repo pull requests)
        if: ${{ always() && needs.changes.outputs.run == 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          results: ${{ needs.tarballs.result }},${{ needs.consumer.result }}
          allow-skipped: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
