# =============================================================================
# Security · Scan — thin caller of the shared reusable suite (qnsc-ci).
#
# qnsc-app-platform is a TypeScript library monorepo (packages/* published as
# @quynhonsemiconductor/*, no Dockerfile), so it calls the shared workflow with
# `scan_container: false`: the Trivy container-CVE job is skipped while Semgrep
# (SAST, replaces CodeQL), Gitleaks (secrets) and osv-scanner (dependency CVEs,
# reads pnpm-lock.yaml) still run source-based.
#
# This is a foundational library consumed by rally/opshub — a vulnerable
# transitive dep or injected pattern here propagates to every product, so this
# gate belongs here just as much as in the app repos.
#
# actions-security (zizmor) replaces Code Scanning Default Setup's
# `Analyze (actions)`. Blocking — the initial rollout ran clean, no findings.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # weekly Monday 04:00 UTC — catch new CVEs between pushes

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # zizmor: ignore[excessive-permissions] ceiling for reusable's SARIF job
  packages: read # ceiling for the reusable Trivy job's `packages: read`; a called
  # workflow's job permissions can only be REDUCED, not elevated, above the caller's
  # top-level grant. Trivy is skipped here (scan_container: false), but GitHub validates
  # every reusable job's permission ceiling at STARTUP before evaluating `if:`, so this
  # must be present or the whole run fails with startup_failure.

jobs:
  security:
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@v1
    with:
      product: qnsc-app-platform
      scan_container: false # no Dockerfile — skip Trivy, keep Semgrep + Gitleaks + osv
      node_version: '22'
      # ENFORCED, not report-only. The shared workflow defaults this to false and
      # nothing here had set it, so osv-scanner printed sixteen findings as warnings
      # inside a job that concluded `success`. A green check that means "the scanner
      # ran" rather than "the tree is clean" is worse than no check, because it is read
      # as the second thing — and this repo publishes the packages every product
      # consumes, so a floor missing here is a floor missing downstream.
      #
      # Every finding it was hiding is cleared in the same change that sets this, so it
      # is turned on against a clean tree rather than left to be triaged later — which
      # is how it came to be false in the first place.
      osv_blocking: true
    # security.yml declares no secrets — nothing to pass (no `secrets: inherit`).

  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true
