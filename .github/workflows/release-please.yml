# Auto-creates per-package "chore(release): <component> <version>" PRs on every
# main push, then tags "<component>-v<version>" when merged. The tag triggers
# publish.yml. Reuses the shared workflow from quynhonsemiconductor/ci.
name: Release

on:
  push:
    branches: [main]
  # Manual re-run: regenerates the release PR from current main without waiting for a push.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: quynhonsemiconductor/ci/.github/workflows/release-please.yml@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
    with:
      config_file: release-please-config.json
      manifest_file: .release-please-manifest.json
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
