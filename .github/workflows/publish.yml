# Publishes a single package to GitHub Packages when release-please pushes a
# "<component>-v<version>" tag (e.g. platform-cache-v1.0.0). The component maps
# 1:1 to a directory under packages/.
name: Publish

on:
  # Re-publish an existing tag without tag surgery. Needed the first time a new
  # package is added and this allowlist is not updated with it: release-please
  # tags and releases correctly, no workflow fires, and the only other way to
  # recover is deleting and re-pushing a tag that already has a GitHub Release
  # attached. Same permission level as pushing the tag in the first place.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. platform-runtime-v0.1.1'
        required: true
        type: string
  push:
    tags:
      - 'identity-v*'
      - 'platform-cache-v*'
      - 'platform-http-v*'
      - 'observability-v*'
      - 'platform-runtime-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # On a tag push this is already the tag; on a manual run it is the
          # default branch, so check out the tag the operator named.
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: 10.33.2

      # No `cache: pnpm` here deliberately: this workflow PUBLISHES a package on a
      # tag push, and a cross-run pnpm cache is a poisoning surface for a job with
      # publish credentials -- a separate, lower-trust run could seed a shared cache
      # key this trusted run then reads from.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@quynhonsemiconductor'

      - run: pnpm install --frozen-lockfile

      # Build the whole workspace so inter-package type deps resolve in order.
      - run: pnpm build

      - name: Resolve package directory from tag
        id: pkg
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          component="${tag%-v*}"
          dir="packages/${component}"
          if [ ! -d "$dir" ]; then
            echo "::error::No package directory for tag '$tag' (expected $dir)"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: pnpm --filter "./${{ steps.pkg.outputs.dir }}" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
