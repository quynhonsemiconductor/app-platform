packages: []

# pnpm 11 refuses a release younger than a day. The first-party packages are released here, and this
# project exists to check a release right after it ships, so they are exempt; everything else keeps the
# default.
minimumReleaseAgeExclude:
  - "@quynhonsemiconductor/*"

# The same transitive CVE floors as the repo root and spikes/better-auth, for the same reason: the root
# `security / Dependency CVE scan (osv-scanner)` walks the repo recursively and is BLOCKING, so this
# lockfile is scanned too. Nothing here declares these packages.
overrides:
  "js-yaml@4": "^4.3.2"
  # `@nestjs/platform-fastify` pins fastify EXACTLY, so a range floor on fastify cannot reach it.
  "@nestjs/platform-fastify>fastify": "5.12.7"
  # GHSA-mrhx-c7xc-m3w5 (CVSS 8.2, memory exhaustion validating oversized constrained
  # collections, fixed 4.6.6): exactly one zod version in this lockfile.
  "zod@>=4 <4.6.6": "4.6.6"

# pnpm 11 fails an install that ignores a build script unless the decision is recorded. Same as the root
# workspace: none is needed (testcontainers falls back to pure JS for ssh2 and cpu-features).
allowBuilds:
  "@scarf/scarf": false
  cpu-features: false
  protobufjs: false
  ssh2: false
