packages: []

# pnpm 11 refuses a release younger than a day. The first-party packages are released here, and this
# project exists to check a release right after it ships, so they are exempt; everything else keeps the
# default.
minimumReleaseAgeExclude:
  - "@quynhonsemiconductor/*"

# The same transitive CVE floors as the repo root and spikes/better-auth, for the same reason: the root
# `security / Dependency CVE scan (osv-scanner)` walks the repo recursively and is BLOCKING, so this
# lockfile is scanned too. Nothing here declares these packages.
overrides:
  "js-yaml@4": "^4.3.2"
  # `@nestjs/platform-fastify` pins fastify EXACTLY, so a range floor on fastify cannot reach it.
  "@nestjs/platform-fastify>fastify": "5.12.7"
  # Mirrors the root workspace's CVE floors: GHSA-xcx6-jx8p-x3h5 (msal-node 7.1.0),
  # GHSA-333x/-w74x/-wjr9/-xhq7 (fast-uri 3.1.9 / 4.2.3), GHSA-85x2/-8c8m/-m943
  # (nodemailer; this workspace pins 10.2.0 to match the direct dependency and
  # platform-mail's optional peer — the root workspace keeps 10.1.7),
  # GHSA-4qv8/-f72v (undici 8.12.2). See the root file for detail.
  "@azure/identity>@azure/msal-node": "7.1.1"
  "fast-uri@>=4 <4.2.3": "4.2.3"
  "fast-uri@>=3 <3.1.9": "3.1.9"
  "nodemailer@<10.1.4": "10.2.0"
  "undici@>=8 <8.12.2": "8.12.2"
  # GHSA-mrhx-c7xc-m3w5 (CVSS 8.2, memory exhaustion validating oversized constrained
  # collections, fixed 4.6.6): exactly one zod version in this lockfile.
  "zod@>=4 <4.6.6": "4.6.6"

  # Keep Better Auth's optional peers out of the production tree, declaratively. better-auth declares
  # 18 OPTIONAL peers (its CLI `drizzle-kit`, its test helpers `vitest`, its React/Svelte/Vue clients,
  # the databases it can run on ...); pnpm resolves an optional peer against whatever the importing
  # project has installed, so vitest (a devDependency here) lands in better-auth's lockfile snapshot
  # as an optionalDependency, and `pnpm install --prod` follows optional dependencies — the runtime
  # tree gains vitest, vite and esbuild (how a Trivy CRITICAL on esbuild once reached opshub's image;
  # see identity's README). Remove every optional peer instead of resolving it — all 16, not only the
  # ones installed today, so a product adding react or prisma later stays safe. drizzle-orm and pg
  # stay: identity uses them. A vitest test in packages/identity fails when a better-auth bump adds
  # or removes a peer, so this list cannot silently drift.
  #
  # This replaces the old `.pnpmfile.cjs`, whose pnpmfileChecksum broke every Renovate lockfile regen
  # (#271, #316); an override lives in this file, which Renovate keeps. pnpm 11 honours it; pnpm
  # 10.33.2 (opshub's Docker pin) keeps the peers out of the production tree too, though it still
  # records the peer declarations in the lockfile manifest copy (checked 2026-10-26).
  "better-auth>@lynx-js/react": "-"
  "better-auth>@prisma/client": "-"
  "better-auth>@sveltejs/kit": "-"
  "better-auth>@tanstack/react-start": "-"
  "better-auth>@tanstack/solid-start": "-"
  "better-auth>drizzle-kit": "-"
  "better-auth>mongodb": "-"
  "better-auth>mysql2": "-"
  "better-auth>next": "-"
  "better-auth>prisma": "-"
  "better-auth>react": "-"
  "better-auth>react-dom": "-"
  "better-auth>solid-js": "-"
  "better-auth>svelte": "-"
  "better-auth>vitest": "-"
  "better-auth>vue": "-"

# pnpm 11 fails an install that ignores a build script unless the decision is recorded. Same as the root
# workspace: none is needed (testcontainers falls back to pure JS for ssh2 and cpu-features).
allowBuilds:
  "@scarf/scarf": false
  cpu-features: false
  protobufjs: false
  ssh2: false
