# The end-to-end async path (plan criterion 9) against the PUBLISHED packages.
#
# `reference-consumer/` is its own pnpm root. It installs identity, platform-http, platform-jobs,
# platform-mail and their peers FROM GITHUB PACKAGES, exactly as a product does, then boots an API and a
# worker as separate processes against PostgreSQL, Valkey and Mailpit: request -> identity sign-up ->
# mail.send enqueued in the same transaction -> worker -> SMTP. See reference-consumer/README.md.
#
# Not part of the `CI required` gate, on purpose: it needs the registry and several image pulls, and
# what it checks is a RELEASE, not a pull request. It runs
#   * on a pull request that changes the consumer or this workflow,
#   * weekly, so a bad release (or a registry change) is noticed without waiting for a product,
#   * AFTER EVERY SUCCESSFUL `Publish` RUN, for a tag whose commit is on main: it moves the first-party
#     packages to their newest published versions first, because the lockfile pins the previous ones and
#     re-running it as it stands would test nothing new,
#   * on demand (`latest: true` does the same "newest published" run by hand).
name: Reference consumer

on:
  pull_request:
    paths:
      - 'reference-consumer/**'
      - '.github/workflows/reference-consumer.yml'
  schedule:
    - cron: '41 3 * * 1' # Mondays 03:41 UTC
  workflow_dispatch:
    inputs:
      latest:
        description: 'Test the newest PUBLISHED first-party versions instead of the pinned ones'
        type: boolean
        default: false
  # `publish.yml` is triggered by a TAG push, so the triggering run's `head_branch` is the tag name
  # (`identity-v8.0.0`), never `main`: a `branches:` filter here would silently never match. "Main only"
  # is checked by the `guard` job instead. This trigger always runs the workflow file on the DEFAULT
  # branch, and nothing from the triggering run is checked out or executed.
  # zizmor flags every workflow_run. The risk it names is a privileged run that checks out or executes code
  # from the triggering run; this one does neither (it uses its own default-branch files), the triggering
  # workflow runs only on tag pushes by people who can already publish, and the job holds read-only tokens.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Publish]
    types: [completed]

concurrency:
  # One release publishes several packages, and each tag is a separate `Publish` run, so this fires
  # several times within seconds. Those runs QUEUE (at most one more waits, and the newest replaces an
  # older waiting one) instead of cancelling a run that is already under way; the last one to run sees
  # every package of the release. A pull request still cancels its own earlier run.
  #
  # So a queued `workflow_run` run that shows up as CANCELLED is expected, not a failure: GitHub
  # concurrency collapses the queue to the latest pending run. Seen on the 8.0.1 / 0.1.2 release, which
  # published three packages: of the three runs, one was cancelled in favour of the newest, and both that
  # ran saw the same, complete set of versions (identity 8.0.1, platform-jobs 0.1.2, platform-mail 0.1.2).
  group: reference-consumer-${{ github.event_name == 'workflow_run' && 'published' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

permissions: {}

jobs:
  # Decides whether the job below should run at all, so that "not for this event" is a skipped job and
  # not a green one that tested nothing.
  guard:
    name: Should this run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          # Only meaningful for a pull request / a workflow_run; read through env, never interpolated.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          proceed=true
          case "$EVENT" in
            pull_request)
              # A fork's pull request has no token that can read the registry.
              if [ "$PR_HEAD_REPO" != "$REPO" ]; then proceed=false; echo "fork pull request: skipped"; fi
              ;;
            workflow_run)
              if [ "$RUN_CONCLUSION" != "success" ]; then
                proceed=false
                echo "Publish run '$RUN_REF' ended '$RUN_CONCLUSION': nothing was published, skipped"
              elif ! [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                proceed=false
                echo "unexpected head_sha: skipped"
              else
                # Is the published commit on main? `identical` or `behind` means the commit is main
                # itself or one of its ancestors; `ahead`/`diverged` is somewhere else.
                status="$(gh api "repos/$REPO/compare/main...$RUN_SHA" --jq .status)"
                echo "Publish run '$RUN_REF' at ${RUN_SHA:0:7} is '$status' relative to main"
                case "$status" in identical|behind) ;; *) proceed=false; echo "not on main: skipped" ;; esac
              fi
              ;;
          esac
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  async-path:
    name: Async path (published packages)
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: reference-consumer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # pnpm 11 ignores `${NODE_AUTH_TOKEN}` in a project .npmrc (the file is committed), so the token
      # goes into a user-level config outside the workspace. The steps that talk to the registry point at
      # it through their own `env` (not through GITHUB_ENV, which has no business in a privileged trigger).
      - name: Registry credentials
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$TOKEN" > "$RUNNER_TEMP/npmrc"

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc

      # After a publish (or on request): the lockfile pins the PREVIOUS release, so move every first-party
      # package to the newest published version before testing. The registry can lag a moment behind a
      # finished publish run, so when this run is for a known tag the version it names must actually be the
      # one installed, retried for a while, and the run fails (it does not test the old one) if it never is.
      # The change is made in the runner's copy and never committed.
      - name: Use the newest published versions
        if: github.event_name == 'workflow_run' || inputs.latest
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          want_pkg=""; want_ver=""
          if [[ "$TAG" =~ ^([a-z][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            want_pkg="${BASH_REMATCH[1]}"; want_ver="${BASH_REMATCH[2]}"
            # A package the consumer does not depend on yet (a newly added one): nothing to assert about
            # it, but say so, so that the run is not mistaken for a check of that release.
            if [ ! -d "node_modules/@quynhonsemiconductor/$want_pkg" ]; then
              echo "::warning::$want_pkg is not a dependency of reference-consumer: add it to check its release"
              want_pkg=""; want_ver=""
            fi
          fi
          installed() { node -p "require('./node_modules/@quynhonsemiconductor/$1/package.json').version"; }
          for attempt in 1 2 3 4 5 6; do
            pnpm update --latest '@quynhonsemiconductor/*'
            if [ -z "$want_pkg" ] || [ "$(installed "$want_pkg")" = "$want_ver" ]; then break; fi
            echo "attempt $attempt: $want_pkg is $(installed "$want_pkg"), waiting for $want_ver"
            if [ "$attempt" = 6 ]; then
              echo "::error::$want_pkg@$want_ver is not installable from the registry after 6 attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Which versions are under test
        run: |
          for p in identity platform-http platform-jobs platform-mail observability platform-db platform-cache platform-runtime; do
            # By path: a package with an `exports` map does not expose package.json to require().
            printf '%s@%s\n' "$p" "$(node -p "require('./node_modules/@quynhonsemiconductor/$p/package.json').version")"
          done

      - run: docker version --format 'docker {{.Server.Version}}'

      - name: Test
        run: pnpm test
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
